<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #17332D;
      --bg-elevated: #21453D;
      --ink: #FAF7F0;
      --ink-muted: #B8C4BE;
      --surface: #FCF9F2;
      --surface-ink: #1B2825;
      --border: #DFBE74;
      --border-subtle: rgba(223, 190, 116, 0.4);
      --accent-red: #C84644;
      --accent-gold: #DFBE74;
      --accent-emerald: #2A634C;
      --mono: 'Space Mono', monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 0 20px 64px;
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновый снегопад */
    .snow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.7;
      }
      88% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(105vh) translateX(22px) rotate(180deg);
        opacity: 0;
      }
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Верхняя гирлянда */
    .garland-bar {
      width: 100%;
      height: 44px;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .garland-wire {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
    }

    .bulb {
      transform-origin: center;
      animation: twinkle 2.8s ease-in-out infinite alternate;
    }

    .bulb:nth-child(2n) {
      animation-delay: 0.9s;
      animation-duration: 3.3s;
    }

    .bulb:nth-child(3n) {
      animation-delay: 1.7s;
      animation-duration: 2.4s;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.45;
        filter: drop-shadow(0 0 1px rgba(223, 190, 116, 0.2));
      }
      100% {
        opacity: 1;
        filter: drop-shadow(0 0 7px rgba(223, 190, 116, 0.9));
      }
    }

    /* Шапка: 3/4 основной блок и 1/4 компактные компетенции */
    header {
      border-top: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 26px 0;
      margin-bottom: 36px;
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 28px;
      align-items: start;
    }

    .header-main {
      display: flex;
      flex-direction: column;
    }

    .badge {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 700;
      margin-bottom: 10px;
      display: inline-block;
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .role {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--ink-muted);
      margin-bottom: 16px;
    }

    .bio {
      font-size: 15px;
      max-width: 680px;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .contacts-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .contact-link {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 2px solid var(--accent-red);
      padding-bottom: 2px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .contact-link:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Правая четверть экрана: компактные компетенции */
    .header-aside {
      border-left: 1px solid var(--border-subtle);
      padding-left: 20px;
    }

    .meta-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .skill-tag {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.25;
      padding: 3px 6px;
      border: 1px solid var(--border-subtle);
      background: rgba(250, 247, 240, 0.06);
      color: var(--ink);
      text-transform: uppercase;
    }

    /* Панель статуса над сеткой */
    .grid-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* Сетка календаря */
    .advent-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-top: 2px solid var(--border);
      border-left: 2px solid var(--border);
      background: var(--border);
    }

    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-elevated);
      border-right: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .tile[data-day="31"] {
      grid-column: span 2;
      aspect-ratio: 2 / 1;
    }

    /* Закрытое состояние (геометрический новогодний орнамент) */
    .tile-cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 2;
      will-change: opacity, transform;
    }

    .tile-cover svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .tile-number {
      position: relative;
      z-index: 1;
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 700;
      background: var(--bg);
      color: var(--accent-gold);
      border: 1.5px solid var(--border);
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .tile.locked {
      cursor: not-allowed;
    }

    .tile.locked:hover .tile-number {
      background: #2C564D;
      color: var(--ink-muted);
    }

    .tile:not(.locked):hover .tile-number {
      background: var(--accent-gold);
      color: var(--bg);
    }

    /* Открытое состояние внутри сетки */
    .tile-opened-preview {
      position: absolute;
      inset: 0;
      background: var(--surface);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    .tile.is-open .tile-cover {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    .preview-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent-red);
      font-weight: 700;
    }

    .preview-tag {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--surface-ink);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-more {
      font-family: var(--mono);
      font-size: 11px;
      color: #556662;
      text-decoration: underline;
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(14, 31, 27, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      color: var(--surface-ink);
      border: 2px solid var(--border);
      max-width: 540px;
      width: 100%;
      padding: 32px;
      position: relative;
      box-shadow: 10px 10px 0 var(--accent-gold);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid rgba(27, 40, 37, 0.15);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .modal-meta {
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent-red);
    }

    .modal-close {
      background: none;
      border: 1.5px solid var(--surface-ink);
      color: var(--surface-ink);
      font-family: var(--mono);
      font-size: 14px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-weight: 700;
    }

    .modal-close:hover {
      background: var(--surface-ink);
      color: var(--surface);
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 14px;
      letter-spacing: -0.02em;
      color: var(--surface-ink);
    }

    .modal-text {
      font-size: 16px;
      line-height: 1.6;
      color: #283A36;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .modal-link {
      display: inline-block;
      background: var(--bg);
      color: var(--accent-gold);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 20px;
      text-decoration: none;
      border: 1.5px solid var(--bg);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .modal-link:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Уведомление */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      color: var(--surface-ink);
      border: 1.5px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 200;
      max-width: 90vw;
      text-align: center;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Подвал и незаметный переключатель режимов */
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1.5px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: var(--ink-muted);
    }

    .footer-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .stealth-toggle {
      background: transparent;
      border: 1px dashed var(--border-subtle);
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 10px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, border-color 0.2s, color 0.2s;
    }

    .stealth-toggle:hover {
      opacity: 1;
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .header-aside {
        border-left: none;
        border-top: 1px solid var(--border-subtle);
        padding-left: 0;
        padding-top: 16px;
      }
      .advent-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 560px) {
      .advent-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .modal-card {
        padding: 24px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .snowflake, .bulb {
        animation: none;
      }
    }
  </style>

<div class="container">
  <!-- Минималистичная гирлянда -->
  <div class="garland-bar" aria-hidden="true">
    <svg class="garland-wire" viewBox="0 0 1200 40" preserveAspectRatio="none">
      <path d="M0,2 Q300,32 600,4 T1200,2" fill="none" stroke="#DFBE74" stroke-width="1.3" stroke-opacity="0.65"/>
      <polygon class="bulb" points="80,10 85,17 80,24 75,17" fill="#DFBE74"/>
      <circle class="bulb" cx="180" cy="18" r="4.5" fill="#C84644"/>

      <polygon class="bulb" points="480,7 485,14 480,21 475,14" fill="#C84644"/>
      <circle class="bulb" cx="600" cy="6" r="4.5" fill="#DFBE74"/>
      <polygon class="bulb" points="720,10 725,17 720,24 715,17" fill="#FAF7F0"/>
      <circle class="bulb" cx="820" cy="18" r="4.5" fill="#C84644"/>
      <polygon class="bulb" points="920,17 925,24 920,31 915,24" fill="#DFBE74"/>

    </svg>
  </div>

  <!-- Шапка: 3/4 основной блок и 1/4 компетенции -->
  <header>
    <div class="header-main">
      <span class="badge" id="ui-badge"></span>
      <h1 id="ui-name"></h1>
      <div class="role" id="ui-role"></div>
      <p class="bio" id="ui-bio"></p>
      <div class="contacts-list" id="ui-contacts"></div>
    </div>
    <aside class="header-aside">
      <div class="meta-label">Ключевые компетенции</div>
      <div class="skills-list" id="ui-skills"></div>

    <h2 class="modal-title" id="modal-title"></h2>

<script src="content.js"></script>
<script>
  (function() {
    // Геометрический снегопад на фоне
    (function initSnow() {
      const snowContainer = document.getElementById('snow-canvas');
      if (!snowContainer) return;
      const count = 24;
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        const size = (i % 3 === 0) ? 7 : 5;
        const left = (i * 4.3 + (i % 5) * 2) % 100;
        const duration = 13 + (i % 7) * 2.4;
        const delay = -(i * 1.4);
        const isGold = i % 4 === 0;

        flake.style.left = left + '%';
        flake.style.width = size + 'px';
        flake.style.height = size + 'px';
        flake.style.animationDuration = duration + 's';
        flake.style.animationDelay = delay + 's';
        flake.style.backgroundColor = isGold ? '#DFBE74' : '#FAF7F0';
        flake.style.transform = i % 2 === 0 ? 'rotate(45deg)' : 'none';
        if (i % 2 !== 0) flake.style.borderRadius = '50%';

        fragment.appendChild(flake);
      }
      snowContainer.appendChild(fragment);
    })();

    if (typeof ADVENT_DATA === 'undefined' || !ADVENT_DATA.days) {
      document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#FAF7F0;">Ошибка загрузки: убедитесь, что файл <b>content.js</b> лежит в одной папке с <b>index.html</b>.</div>';
      return;
    }

    const settings = ADVENT_DATA.settings || {};
    const profile = ADVENT_DATA.profile || {};
    const days = Array.isArray(ADVENT_DATA.days) ? ADVENT_DATA.days : [];

    const STORAGE_OPENED_KEY = 'advent_portfolio_opened_v1';
    const STORAGE_MODE_KEY = 'advent_portfolio_unlock_all_v1';

    const storage = {
      get(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      set(key, val) {
        try { localStorage.setItem(key, val); } catch (e) {}
      },
      remove(key) {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    function sanitizeUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      if (/^(https?:\/\/|mailto:|tel:|\/|\.\/)/i.test(trimmed)) {
        return trimmed;
      }
      return '';
    }

    const savedMode = storage.get(STORAGE_MODE_KEY);
    let isUnlockAllMode = savedMode !== null
      ? savedMode === 'true'
      : Boolean(settings.unlockAllByDefault);

    let openedDays = [];
    try {
      const parsed = JSON.parse(storage.get(STORAGE_OPENED_KEY) || '[]');
      if (Array.isArray(parsed)) openedDays = parsed;
    } catch (e) {
      openedDays = [];
    }

    const safeName = profile.name || 'Портфолио';
    document.title = `${safeName} — Advent Portfolio`;
    document.getElementById('ui-badge').textContent = settings.badge || '';
    document.getElementById('ui-name').textContent = safeName;
    document.getElementById('ui-role').textContent = profile.role || '';
    document.getElementById('ui-bio').textContent = profile.bio || '';
    document.getElementById('ui-footer-note').textContent = [safeName, profile.footerNote].filter(Boolean).join(' · ');

    const skillsContainer = document.getElementById('ui-skills');
    (profile.skills || []).forEach(skill => {
      const span = document.createElement('span');
      span.className = 'skill-tag';
      span.textContent = skill;
      skillsContainer.appendChild(span);
    });

    const contactsContainer = document.getElementById('ui-contacts');
    (profile.contacts || []).forEach(contact => {
      const safeHref = sanitizeUrl(contact.url);
      if (!safeHref) return;
      const a = document.createElement('a');
      a.className = 'contact-link';
      a.href = safeHref;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = contact.label || safeHref;
      contactsContainer.appendChild(a);
    });

    // Осветленная новогодняя геометрия в духе конструктивизма
    function getGeometricPatternSVG(day) {
      const patterns = [
        // 0: Конструктивистская ель
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#21453D"/>
          <polygon points="50,12 82,56 18,56" fill="#2F6F56"/>
          <polygon points="50,38 88,88 12,88" fill="#FAF7F0"/>
          <circle cx="50" cy="12" r="5" fill="#DFBE74"/>
        </svg>`,
        // 1: Рождественская полярная звезда
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#1A3832"/>
          <polygon points="50,8 61,39 92,50 61,61 50,92 39,61 8,50 39,39" fill="#DFBE74"/>
          <circle cx="50" cy="50" r="11" fill="#C84644"/>
        </svg>`,
        // 2: Елочный шар на золотой нити
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#FAF7F0"/>
          <line x1="50" y1="0" x2="50" y2="30" stroke="#17332D" stroke-width="2.5"/>
          <circle cx="50" cy="60" r="30" fill="#C84644"/>
          <path d="M20,60 A30,30 0 0,1 80,60 Z" fill="#DFBE74"/>
        </svg>`,
        // 3: Геометрический снежный кристалл
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#2A634C"/>
          <line x1="15" y1="15" x2="85" y2="85" stroke="#FAF7F0" stroke-width="3"/>
          <line x1="85" y1="15" x2="15" y2="85" stroke="#FAF7F0" stroke-width="3"/>
          <line x1="50" y1="8" x2="50" y2="92" stroke="#DFBE74" stroke-width="3"/>
          <line x1="8" y1="50" x2="92" y2="50" stroke="#DFBE74" stroke-width="3"/>
          <circle cx="50" cy="50" r="10" fill="#17332D"/>
        </svg>`,
        // 4: Зимние арки и золотое солнце
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#21453D"/>
          <path d="M0,100 A50,50 0 0,1 100,100 Z" fill="#FAF7F0"/>
          <path d="M25,100 A25,25 0 0,1 75,100 Z" fill="#C84644"/>
          <circle cx="76" cy="24" r="10" fill="#DFBE74"/>
        </svg>`,
        // 5: Подарочная лента и диагональ
        `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="100" height="100" fill="#C84644"/>
          <polygon points="0,0 100,100 0,100" fill="#1A3832"/>
          <rect x="62" y="0" width="12" height="100" fill="#DFBE74"/>
        </svg>`
      ];

      if (day === 31) {
        return `<svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true">
          <rect width="200" height="100" fill="#1A3832"/>
          <polygon points="45,12 76,88 14,88" fill="#2F6F56"/>
          <circle cx="45" cy="14" r="6" fill="#DFBE74"/>
          <polygon points="135,10 145,38 173,48 145,58 135,86 125,58 97,48 125,38" fill="#DFBE74"/>
          <circle cx="135" cy="48" r="9" fill="#C84644"/>
        </svg>`;
      }

      return patterns[(day * 7 + Math.floor(day / 3)) % patterns.length];
    }

    const targetMonth = Number(settings.targetMonth) || 12;

    function isDayUnlockedByDate(dayNumber) {
      if (isUnlockAllMode) return true;
      const now = new Date();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();
      return currentMonth === targetMonth && dayNumber <= currentDay;
    }

    let toastTimer = null;
    const toastEl = document.getElementById('toast');
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function updateToolbar() {
      document.getElementById('ui-progress').textContent = `Открыто: ${openedDays.length} / ${days.length}`;
      document.getElementById('mode-toggle-btn').textContent = isUnlockAllMode
        ? 'Режим: Открыты все [Рекрутер]'
        : 'Режим: По датам [Календарь]';
      document.getElementById('ui-hint').textContent = isUnlockAllMode
        ? `Доступны все ${days.length} ячеек без ожидания дат`
        : 'Ячейки открываются согласно датам календаря';
    }

    const grid = document.getElementById('advent-grid');
    const tileElements = [];

    function buildGrid() {
      const fragment = document.createDocumentFragment();

      days.forEach(item => {
        const dayNum = Number(item.day);
        const dayLabel = String(dayNum).padStart(2, '0');

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.day = dayNum;
        tile.setAttribute('role', 'button');
        tile.setAttribute('tabindex', '0');

        const cover = document.createElement('div');
        cover.className = 'tile-cover';
        cover.innerHTML = getGeometricPatternSVG(dayNum);

        const numSpan = document.createElement('span');
        numSpan.className = 'tile-number';
        numSpan.textContent = dayLabel;
        cover.appendChild(numSpan);

        const preview = document.createElement('div');
        preview.className = 'tile-opened-preview';

        const previewTop = document.createElement('div');
        previewTop.className = 'preview-top';

        const topNum = document.createElement('span');
        topNum.textContent = `#${dayLabel}`;

        const topTag = document.createElement('span');
        topTag.className = 'preview-tag';
        topTag.textContent = item.tag || '';

        previewTop.appendChild(topNum);
        previewTop.appendChild(topTag);

        const previewTitle = document.createElement('div');
        previewTitle.className = 'preview-title';
        previewTitle.textContent = item.title || '';

        const previewMore = document.createElement('div');
        previewMore.className = 'preview-more';
        previewMore.textContent = 'Читать →';

        preview.appendChild(previewTop);
        preview.appendChild(previewTitle);
        preview.appendChild(previewMore);

        tile.appendChild(cover);
        tile.appendChild(preview);

        const handleActivate = () => {
          if (!isDayUnlockedByDate(dayNum)) {
            showToast(`Ячейка #${dayNum} откроется ${dayLabel}.${String(targetMonth).padStart(2, '0')}. Внизу страницы можно включить режим просмотра всех дат.`);
            return;
          }
          if (typeof ym === 'function') {
    ym(window.YM_ID, 'reachGoal', 'open_day', { day: dayNum });
  }

          if (!openedDays.includes(dayNum)) {
            openedDays.push(dayNum);
            storage.set(STORAGE_OPENED_KEY, JSON.stringify(openedDays));
            tile.classList.add('is-open');
            updateToolbar();
          }

          openModal(item);
        };

        tile.addEventListener('click', handleActivate);
        tile.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleActivate();
          }
        });

        tileElements.push({ tile, dayNum });
        fragment.appendChild(tile);
      });

      grid.appendChild(fragment);
      syncTileStates();
    }

    function syncTileStates() {
      tileElements.forEach(({ tile, dayNum }) => {
        const unlocked = isDayUnlockedByDate(dayNum);
        const isOpened = openedDays.includes(dayNum);
        tile.classList.toggle('locked', !unlocked);
        tile.classList.toggle('is-open', isOpened);
      });
      updateToolbar();
    }

    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalClose = document.getElementById('modal-close');

    function openModal(item) {
      const dayLabel = String(item.day).padStart(2, '0');
      const metaParts = [`День ${dayLabel}`];
      if (item.tag) metaParts.push(item.tag);

      document.getElementById('modal-meta').textContent = metaParts.join(' // ');
      document.getElementById('modal-title').textContent = item.title || '';
      document.getElementById('modal-text').textContent = item.text || '';

      const linkEl = document.getElementById('modal-link');
      const safeLink = sanitizeUrl(item.linkUrl);
      if (item.linkText && safeLink) {
        linkEl.textContent = item.linkText;
        linkEl.href = safeLink;
        linkEl.style.display = 'inline-block';
      } else {
        linkEl.style.display = 'none';
      }

      modalBackdrop.classList.add('active');
      modalClose.focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove('active');
    }

    modalClose.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('active')) {
        closeModal();
      }
    });

    document.getElementById('mode-toggle-btn').addEventListener('click', () => {
      isUnlockAllMode = !isUnlockAllMode;
      storage.set(STORAGE_MODE_KEY, String(isUnlockAllMode));
      syncTileStates();
      showToast(isUnlockAllMode
        ? 'Включен режим свободного просмотра (все ячейки открыты)'
        : 'Включен режим календаря (открытие по датам)');
    });

    document.getElementById('reset-progress-btn').addEventListener('click', () => {
      openedDays = [];
      storage.remove(STORAGE_OPENED_KEY);
      syncTileStates();
      showToast('Орнамент восстановлен: все карточки снова закрыты');
    });

    buildGrid();
  })();
</script>

</body>
</html>
